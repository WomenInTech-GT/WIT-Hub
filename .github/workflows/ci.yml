#Continuous Integration
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    name: Search tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wit_search_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wit_search_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service credentials, not a developer or production database.
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/wit_search_ci
      # Tests require no existing catalog schema; create and roll it back per test.
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/wit_search_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest httpx

      - name: Run unit, API, and PostgreSQL regression tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Create and populate the demo catalog
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as connection:
              for filename in ("backend/migrations/002_content_catalog.sql", "content/seed_catalog_demo.sql"):
                  connection.execute(Path(filename).read_text(encoding="utf-8"))
              count = connection.execute("SELECT count(*) FROM catalog.content_items").fetchone()[0]
              if not count:
                  raise RuntimeError("The demo catalog is empty")
          PY

      - name: Run all configured test searches
        run: python -m search.run_test_queries > search-results-ci.json

      - name: Verify search batch completed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          queries = json.loads(Path("search/test_queries.json").read_text())
          report = json.loads(Path("search-results-ci.json").read_text())
          assert queries, "No test searches configured"
          assert report["status"] == "completed"
          assert report["executed"] == len(queries)
          assert [item["query"] for item in report["results"]] == queries
          assert report["catalog_count"] > 0
          print(f"Executed all {len(queries)} searches successfully")
          PY

      - name: Upload test and search reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-test-results
          path: |
            test-results.xml
            search-results-ci.json
          retention-days: 14

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -d frontend
          test -d backend
          test -d content
          test -d docs

      - name: Check required documentation
        run: |
          test -f README.md
          test -f content/README.md
          test -f docs/architecture.md
          test -f frontend/README.md

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          content_dir = Path("content")
          json_files = list(content_dir.rglob("*.json"))

          for file in json_files:
              with file.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"Valid JSON: {file}")

          if not json_files:
              print("No JSON files found yet; skipping JSON validation.")
          PY
