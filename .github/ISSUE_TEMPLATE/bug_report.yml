
name: Bug Report
description: Report a bug in the WIT Hub website
title: "[Bug]: "
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious is this bug?
      options:
        - Blocker
        - Major
        - Minor
    validations:
      required: true

  - type: input
    id: affected-area
    attributes:
      label: Affected Area
      placeholder: Search, Filters, Homepage, etc.

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain how to reproduce the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Additional Information
      description: Add screenshots or other relevant details.
  