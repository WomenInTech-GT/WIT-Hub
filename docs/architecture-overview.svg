<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">WIT Hub architecture overview</title>
  <desc id="description">An overview of the planned WIT Hub MVP, including the user-facing website, browser-side search and recommendations, static JSON content, GitHub content review and deployment to Cloudflare Pages, with a possible future backend shown separately.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24233a; }
      .title { font-size: 32px; font-weight: 750; }
      .subtitle { font-size: 15px; fill: #626176; }
      .section { font-size: 13px; font-weight: 750; letter-spacing: 1.15px; fill: #747187; }
      .card-title { font-size: 19px; font-weight: 700; }
      .body { font-size: 14px; fill: #555368; }
      .small { font-size: 12px; fill: #6a687a; }
      .pill { font-size: 12px; font-weight: 650; }
      .line { fill: none; stroke: #938da9; stroke-width: 2; }
      .dashed { fill: none; stroke: #a7a3b2; stroke-width: 2; stroke-dasharray: 8 7; }
      .user { fill: #f0edff; stroke: #b7a9ef; stroke-width: 1.5; }
      .frontend { fill: #ffffff; stroke: #bbb4d6; stroke-width: 1.7; }
      .feature { fill: #faf8ff; stroke: #ddd7f0; stroke-width: 1.2; }
      .content { fill: #eef8f3; stroke: #a9d6c1; stroke-width: 1.5; }
      .repo { fill: #f3f5f8; stroke: #c6cbd6; stroke-width: 1.5; }
      .deploy { fill: #fff7e9; stroke: #ebcb83; stroke-width: 1.5; }
      .future { fill: #fafafa; stroke: #bcb9c4; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .badge { fill: #e7f5eb; }
      .badge-text { fill: #32704a; }
      .chip { fill: #f1eff7; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#938da9"/>
    </marker>
    <marker id="arrow-dash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a7a3b2"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="#fbfaff"/>

  <text x="64" y="58" class="title">WIT Hub — Architecture Overview</text>
  <text x="64" y="86" class="subtitle">Planned MVP architecture based on the uploaded architecture and project overview documents</text>
  <rect x="1374" y="38" width="162" height="30" rx="15" class="badge"/>
  <text x="1393" y="58" class="pill badge-text">MVP · STATIC SITE</text>

  <text x="64" y="136" class="section">VISITOR EXPERIENCE · BROWSER</text>
  <rect x="64" y="154" width="1472" height="84" rx="16" class="user"/>
  <text x="92" y="189" class="card-title">Students &amp; Georgia Tech community</text>
  <text x="92" y="215" class="body">Browse, search and filter opportunities, events, programs, resources and student projects</text>
  <text x="1130" y="189" class="body">Responsive • accessible design target</text>
  <text x="1130" y="215" class="small">Anonymous, privacy-conscious analytics planned</text>

  <path d="M800 238 V284" class="line" marker-end="url(#arrow)"/>

  <text x="64" y="310" class="section">STATIC FRONTEND · NO RUNTIME BACKEND IN MVP</text>
  <rect x="64" y="330" width="1472" height="328" rx="20" class="frontend"/>
  <text x="96" y="370" class="card-title">WIT Hub website</text>
  <text x="1324" y="369" class="small">Runs in visitor's browser</text>

  <rect x="96" y="396" width="336" height="104" rx="13" class="feature"/>
  <text x="120" y="431" class="card-title">Home</text>
  <text x="120" y="459" class="body">Featured content and entry points</text>
  <text x="120" y="481" class="small">Landing page for the hub</text>

  <rect x="456" y="396" width="336" height="104" rx="13" class="feature"/>
  <text x="480" y="431" class="card-title">Explore directory</text>
  <text x="480" y="459" class="body">Opportunities • Events • Programs</text>
  <text x="480" y="481" class="small">Resources • shared listing details</text>

  <rect x="816" y="396" width="336" height="104" rx="13" class="feature"/>
  <text x="840" y="431" class="card-title">Search &amp; filter</text>
  <text x="840" y="459" class="body">Type • major relevance • year</text>
  <text x="840" y="481" class="small">Deadline and other matching criteria</text>

  <rect x="1176" y="396" width="328" height="104" rx="13" class="feature"/>
  <text x="1200" y="431" class="card-title">Find Something for Me</text>
  <text x="1200" y="459" class="body">Guided, rule-based suggestions</text>
  <text x="1200" y="481" class="small">AI recommendations are a later phase</text>

  <rect x="96" y="520" width="336" height="104" rx="13" class="feature"/>
  <text x="120" y="555" class="card-title">Student projects</text>
  <text x="120" y="583" class="body">Showcase student technical work</text>
  <text x="120" y="605" class="small">Content source/schema to be defined</text>

  <rect x="456" y="520" width="1048" height="104" rx="13" class="feature"/>
  <text x="480" y="555" class="card-title">Client-side content experience</text>
  <text x="480" y="583" class="body">Loads structured content directly • renders listings and details • filters and searches in the browser</text>
  <text x="480" y="605" class="small">No user accounts or deployed API are specified for the MVP</text>

  <path d="M800 658 V704" class="line" marker-end="url(#arrow)"/>
  <text x="64" y="729" class="section">CONTENT SOURCE &amp; REPOSITORY WORKFLOW</text>

  <rect x="64" y="748" width="440" height="190" rx="16" class="content"/>
  <text x="92" y="784" class="card-title">Structured JSON content</text>
  <text x="92" y="815" class="body">Opportunities • Events • Programs • Resources</text>
  <text x="92" y="844" class="body">Shared fields include title, description, URL,</text>
  <text x="92" y="866" class="body">source and last-updated date</text>
  <text x="92" y="908" class="small">Stored under content/ and read directly by frontend</text>

  <rect x="580" y="748" width="440" height="190" rx="16" class="repo"/>
  <text x="608" y="784" class="card-title">GitHub repository</text>
  <text x="608" y="815" class="body">Content submitted and reviewed via pull request</text>
  <text x="608" y="844" class="body">Check working link • verify deadline</text>
  <text x="608" y="866" class="body">Record a named source</text>
  <text x="608" y="908" class="small">Approved changes merge to the main branch</text>

  <rect x="1096" y="748" width="440" height="190" rx="16" class="deploy"/>
  <text x="1124" y="784" class="card-title">Build &amp; hosting</text>
  <text x="1124" y="815" class="body">GitHub Actions build/deploy workflow</text>
  <text x="1124" y="844" class="body">Cloudflare Pages hosts the static website</text>
  <text x="1124" y="873" class="body">Merged updates trigger a redeploy</text>
  <text x="1124" y="908" class="small">Hosting plan from architecture notes</text>

  <path d="M504 844 H580" class="line" marker-end="url(#arrow)"/>
  <text x="517" y="831" class="small">maintain</text>
  <path d="M1020 844 H1096" class="line" marker-end="url(#arrow)"/>
  <text x="1032" y="831" class="small">merge / deploy</text>

  <path d="M1316 748 V692 H1410 V658" class="line" marker-end="url(#arrow)"/>
  <text x="1328" y="682" class="small">serves site</text>
  <path d="M284 748 V686 H190 V658" class="line" marker-end="url(#arrow)"/>
  <text x="204" y="681" class="small">content files</text>

  <rect x="64" y="974" width="1472" height="104" rx="16" class="future"/>
  <text x="92" y="1008" class="section">POSSIBLE FUTURE EXTENSION · NOT PART OF MVP RUNTIME</text>
  <text x="92" y="1043" class="body">Optional backend/API and database if needed for authentication, dynamic content editing, external integrations, or server-side search.</text>
  <text x="92" y="1065" class="small">A backend such as FastAPI or a database such as PostgreSQL are possibilities mentioned in project notes, not finalized implementation choices.</text>
  <path d="M1536 640 H1564 V1025 H1540" class="dashed" marker-end="url(#arrow-dash)"/>
</svg>
